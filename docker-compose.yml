x-gateway-common: &gateway-common
  image: caddy:2-alpine
  volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
  depends_on:
    frontend:
      condition: service_healthy
    api:
      condition: service_healthy
  healthcheck:
    test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  restart: unless-stopped

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: file:/data/reconecta.db
      CORS_ORIGIN: ${APP_ORIGIN:?Defina APP_ORIGIN com a origem HTTPS pública no Coolify}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      ADMIN_NAME: ${ADMIN_NAME:-Administração}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@reconectati.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
    volumes:
      - reconecta-data:/data
    expose:
      - "3002"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  gateway:
    <<: *gateway-common
    expose:
      - "80"

  gateway-local:
    <<: *gateway-common
    profiles:
      - local
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:80"

volumes:
  reconecta-data:
